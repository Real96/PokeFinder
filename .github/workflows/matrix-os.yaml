name: CI - Crossplatform

on:
  push:
    branches:
      - "master"
      - "feature/**"
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+"
  pull_request:

jobs:
  ci:
    name: Build (${{ matrix.platform-name }})
    runs-on: ${{ matrix.os }}
    env: ${{ matrix.env || fromJSON('{}') }} 
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform-name: Windows
            cache-key: windows
            qt-archives: qtbase qtsvg qttools
            tools: tools_opensslv3_x64

          - os: ubuntu-24.04
            platform-name: Ubuntu
            cache-key: ubuntu
            qt-archives: icu qtbase qtsvg qttools
            tools: ""
            env: { CC: gcc-14, CXX: g++-14 }

          - os: macos-15
            platform-name: macOS
            cache-key: macos
            qt-archives: qtbase qtsvg qttools
            tools: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set Python version
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Install platform-specific package manager requirements
      - name: Install Build System Dependencies (Windows)
        if: matrix.platform-name == 'Windows'
        run: choco install ninja -y

      - name: Install Build System Dependencies (Ubuntu)
        if: matrix.platform-name == 'Ubuntu'
        run: |
          sudo apt update
          sudo apt install -y appstream ninja-build libfuse2

      - name: Install Build System Dependencies (macOS)
        if: matrix.platform-name == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          archives: ${{ matrix.qt-archives }}
          tools: ${{ matrix.tools }}
          cache: true

      - name: Initialize ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-${{ matrix.cache-key }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ matrix.cache-key }}-master-
            ccache-${{ matrix.cache-key }}-

      - name: Configure Developer Command Prompt (Windows)
        if: matrix.platform-name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEST=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            ${{ matrix.platform-name == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"' || '' }}

      - name: Build PokeFinder
        run: cmake --build build

      - name: Test PokeFinder
        run: ctest --test-dir build -V

      - name: Package PokeFinder (Windows)
        if: matrix.platform-name == 'Windows'
        run: |
          mkdir PokeFinder
          mkdir PokeFinder/platforms
          mkdir PokeFinder/styles
          mv build/PokeFinder.exe PokeFinder/
          windeployqt --no-translations --no-plugins --no-opengl-sw --no-system-d3d-compiler PokeFinder/PokeFinder.exe
          rm -Force PokeFinder/vc_redist*.exe
          cp "${{env.QT_ROOT_DIR}}/plugins/platforms/qwindows.dll" PokeFinder/platforms/
          cp "${{env.QT_ROOT_DIR}}/plugins/styles/qmodernwindowsstyle.dll" PokeFinder/styles/
          cp "${{env.QT_ROOT_DIR}}/../../Tools/OpenSSLv3/Win_x64/bin/lib*.dll" PokeFinder/
          7z a PokeFinder-win.zip PokeFinder
          mkdir upload && mv PokeFinder upload

      - name: Package PokeFinder (Ubuntu)
        if: matrix.platform-name == 'Ubuntu'
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod a+x linuxdeploy-*.AppImage
          
          export QMAKE=$QT_ROOT_DIR/bin/qmake
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            -e build/PokeFinder \
            -d Form/io.github.admiral_fish.pokefinder.desktop \
            -i Form/Images/Icon/pokefinder_16x16.png \
            -i Form/Images/Icon/pokefinder_24x24.png \
            -i Form/Images/Icon/pokefinder_32x32.png \
            -i Form/Images/Icon/pokefinder_48x48.png \
            -i Form/Images/Icon/pokefinder_256x256.png \
            --icon-filename io.github.admiral_fish.pokefinder
          mkdir -p AppDir/usr/share/metainfo
          cp Form/io.github.admiral_fish.pokefinder.appdata.xml AppDir/usr/share/metainfo/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv PokéFinder-x86_64.AppImage PokeFinder-x86_64.AppImage
          
          tar czf PokeFinder-linux.tar.gz -C ./build/ PokeFinder
          tar czf PokeFinder-linux-AppImage.tar.gz PokeFinder-x86_64.AppImage

      - name: Package PokeFinder (macOS)
        if: matrix.platform-name == 'macOS'
        run: |
          mv build/PokeFinder.app .
          macdeployqt PokeFinder.app -verbose=3
          tar czf PokeFinder-macOS.tar.gz PokeFinder.app
          mkdir upload && mv PokeFinder.app upload

      - name: Upload Artifact (Windows / macOS)
        if: matrix.platform-name != 'Ubuntu'
        uses: actions/upload-artifact@v6
        with:
          name: PokeFinder-${{ matrix.platform-name }}
          path: upload

      - name: Upload Artifact (Linux Binary)
        if: matrix.platform-name == 'Ubuntu'
        uses: actions/upload-artifact@v6
        with:
          name: PokeFinder-linux
          path: ./build/PokeFinder

      - name: Upload Artifact (Linux AppImage)
        if: matrix.platform-name == 'Ubuntu'
        uses: actions/upload-artifact@v6
        with:
          name: PokeFinder-linux-AppImage
          path: PokeFinder-x86_64.AppImage

      # Hand the packaged archives (which preserve file permissions and the
      # macOS bundle structure) over to the "prerelease" job. These temporary
      # artifacts are deleted as soon as the pre-release has been published.
      - name: Upload Archives for Pre-Release
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: prerelease-${{ matrix.cache-key }}
          path: |
            PokeFinder-*.zip
            PokeFinder-*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            PokeFinder-win.zip
            PokeFinder-linux.tar.gz
            PokeFinder-linux-AppImage.tar.gz
            PokeFinder-macOS.tar.gz

  prerelease:
    name: Publish Pre-Release
    needs: ci
    # Runs only after all three builds succeeded, and only for branch pushes:
    # tag pushes already publish a regular release, and pull requests must
    # never publish anything.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create and delete releases and tags
      actions: write # delete the temporary artifacts
    # Never let two runs publish or delete pre-releases at the same time.
    concurrency:
      group: prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Fixed tag of the rolling pre-release, so the links never change:
      #   https://github.com/<owner>/<repo>/releases/tag/dev-build
      #   https://github.com/<owner>/<repo>/releases/download/dev-build/<file name>
      # Only a pre-release with exactly this tag is ever deleted.
      PRERELEASE_TAG: dev-build

    steps:
      # If an older run finishes after a newer one, do not let it replace
      # the newer pre-release with an outdated build. The run number of the
      # published build is kept in a hidden comment of its release notes.
      - name: Check for Newer Pre-Release
        id: check
        run: |
          set -euo pipefail
          published_run=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRERELEASE_TAG}" \
            --jq '.body // "" | capture("<!-- build-run-number: (?<n>[0-9]+) -->").n // "0"' \
            2>/dev/null || echo 0)
          if [ "${published_run:-0}" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "::notice::Build #${published_run} is newer than this one (#${GITHUB_RUN_NUMBER}); skipping the pre-release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Archives
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: prerelease-*
          path: assets
          merge-multiple: true

      # Upload everything to a draft first. A draft is not public and creates
      # no tag yet, so the current pre-release stays online during the upload.
      - name: Upload Draft Pre-Release
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail

          files=(
            assets/PokeFinder-win.zip
            assets/PokeFinder-linux.tar.gz
            assets/PokeFinder-linux-AppImage.tar.gz
            assets/PokeFinder-macOS.tar.gz
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing archive: $file"
              exit 1
            fi
          done

          # Remove drafts left behind by earlier runs that failed halfway.
          gh release list --limit 1000 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName
                  | select(startswith(env.PRERELEASE_TAG + "-draft-"))' |
          while read -r stale_draft; do
            echo "Deleting stale draft ${stale_draft}"
            gh release delete "$stale_draft" --yes
          done

          draft_tag="${PRERELEASE_TAG}-draft-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DRAFT_TAG=${draft_tag}" >> "$GITHUB_ENV"

          short_sha="${GITHUB_SHA::7}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > notes.md <<EOF
          Automated development build of commit [${short_sha}](${commit_url}) on branch **${GITHUB_REF_NAME}** ([workflow run](${run_url})).

          > [!WARNING]
          > This is not an official release and it may be unstable. It is replaced automatically by the next build. For stable versions, use the latest regular release.

          | Platform | File |
          | --- | --- |
          | Windows (x64) | PokeFinder-win.zip |
          | Linux (binary) | PokeFinder-linux.tar.gz |
          | Linux (AppImage) | PokeFinder-linux-AppImage.tar.gz |
          | macOS (Intel + Apple Silicon) | PokeFinder-macOS.tar.gz |

          <!-- build-run-number: ${GITHUB_RUN_NUMBER} -->
          EOF

          gh release create "$draft_tag" "${files[@]}" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build #${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME} @ ${short_sha})" \
            --notes-file notes.md

      # Swap the previous pre-release for the new draft. Regular releases and
      # manually created pre-releases are never touched, and the job stops
      # without deleting anything if PRERELEASE_TAG is used by a regular
      # release or if its tag can never be reused (immutable releases).
      - name: Replace Previous Pre-Release
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail

          if release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRERELEASE_TAG}" 2>/dev/null); then
            if [ "$(jq -r '.prerelease' <<< "$release_json")" != "true" ]; then
              echo "::error::Tag ${PRERELEASE_TAG} belongs to a regular release; refusing to delete it."
              exit 1
            fi
            if [ "$(jq -r '.immutable // false' <<< "$release_json")" = "true" ]; then
              echo "::error::The current pre-release is immutable, so the tag ${PRERELEASE_TAG} can never be reused. Disable immutable releases or use one tag per build."
              exit 1
            fi
            echo "Deleting previous pre-release ${PRERELEASE_TAG}"
            gh release delete "$PRERELEASE_TAG" --cleanup-tag --yes
          fi

          # A leftover tag without a release would make the new pre-release
          # point to an old commit, so remove it as well.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${PRERELEASE_TAG}" > /dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${PRERELEASE_TAG}"
          fi

          # Publishing the draft creates the tag on the commit that was built.
          gh release edit "$DRAFT_TAG" \
            --tag "$PRERELEASE_TAG" \
            --draft=false \
            --prerelease \
            --latest=false

      # Kept on failure on purpose, so that "Re-run failed jobs" still finds
      # the archives (they expire on their own after one day anyway).
      - name: Delete Temporary Artifacts
        continue-on-error: true
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("prerelease-")) | .id' |
          while read -r artifact_id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
